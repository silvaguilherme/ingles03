# Apache configurado para servir diretamente na porta 8088 com SSL
# Certifique-se de adicionar 'Listen 8088' em /etc/apache2/ports.conf

<VirtualHost *:8088>
    ServerName tstjoinenglish.duckdns.org
    ServerAdmin webmaster@tstjoinenglish.duckdns.org
    
    DocumentRoot /var/www/curso/public
    
    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/tstjoinenglish.duckdns.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/tstjoinenglish.duckdns.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    
    <Directory /var/www/curso/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        
        # Laravel rewrite rules
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.php [L]
        </IfModule>
    </Directory>
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/tstjoinenglish_8088_error.log
    CustomLog ${APACHE_LOG_DIR}/tstjoinenglish_8088_access.log combined
    
    # Segurança
    <Directory /var/www/curso/public>
        Options -Indexes
        
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
    
    <FilesMatch "\.(env|json|config\.js|md|gitignore|gitattributes|lock)$">
        Require all denied
    </FilesMatch>
    
    # Headers de segurança
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>

