server {
    listen 8088 ssl http2;
    listen [::]:8088 ssl http2;
    
    server_name tstjoinenglish.duckdns.org;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/tstjoinenglish.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tstjoinenglish.duckdns.org/privkey.pem;
    
    # SSL Protocols e Ciphers Modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Cache para Performance
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling para validação de certificado mais rápida
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    root /var/www/ingles03/public;
    index index.php index.html;
    
    # ============================
    # Security Headers (Melhorias)
    # ============================
    
    # Strict-Transport-Security (HSTS) - Força HTTPS
    # Idade: 1 ano (31536000 segundos)
    # includeSubDomains: aplica a todos os subdomínios
    # preload: permite inclusão na lista HSTS preload dos browsers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # X-Frame-Options - Previne clickjacking
    # DENY: não permite que o site seja exibido em frames/iframes
    # Use SAMEORIGIN se precisar exibir o site em iframe do mesmo domínio
    add_header X-Frame-Options "DENY" always;
    
    # X-Content-Type-Options - Previne MIME type sniffing
    # Força o browser a respeitar o Content-Type declarado
    add_header X-Content-Type-Options "nosniff" always;
    
    # X-XSS-Protection - Proteção XSS (legado mas ainda útil)
    # 1: habilita filtro XSS
    # mode=block: bloqueia a página ao invés de sanitizar
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Referrer-Policy - Controla informações de referrer
    # strict-origin-when-cross-origin: envia origin completa no mesmo site,
    # apenas origin em HTTPS cross-origin, nada em downgrade HTTPS->HTTP
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content-Security-Policy (CSP) - Previne XSS e injeção de código
    # Esta é uma política moderada - ajuste conforme suas necessidades
    # default-src 'self': permite recursos apenas do mesmo domínio
    # script-src: controla scripts JavaScript
    # style-src: controla CSS
    # img-src: controla imagens (data: para base64, https: para CDNs)
    # font-src: controla fontes
    # connect-src: controla AJAX, WebSockets
    # frame-ancestors 'none': equivalente a X-Frame-Options DENY
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    
    # Permissions-Policy - Controla recursos do browser (antiga Feature-Policy)
    # Desabilita recursos que geralmente não são necessários
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    
    # X-Permitted-Cross-Domain-Policies - Controla Adobe Flash/PDF
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    
    # Remove header que expõe versão do servidor
    server_tokens off;
    more_clear_headers 'Server';
    more_clear_headers 'X-Powered-By';

    # ============================
    # Laravel Routes
    # ============================
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ============================
    # PHP-FPM Configuration
    # ============================
    location ~ \.php$ {
        # Previne execução de PHP em uploads
        try_files $uri =404;
        
        fastcgi_pass unix:/run/php-fpm/www.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_index index.php;
        include fastcgi_params;
        
        # Security Headers para PHP
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        
        # Timeout settings
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # ============================
    # Security Locations
    # ============================
    
    # Bloquear acesso a arquivos ocultos
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Bloquear acesso a arquivos sensíveis do Laravel
    location ~* \.(env|log|txt)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Bloquear acesso ao diretório storage (exceto public)
    location ~* ^/storage/(?!app/public/) {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Favicon e robots.txt - não logar 404
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
    
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    
    # ============================
    # Performance & Caching
    # ============================
    
    # Cache de arquivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    location ~* \.(css|js|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Gzip Compression (adicione ao http block se preferir global)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml+rss application/json application/xml image/svg+xml;
    
    # ============================
    # Logs
    # ============================
    access_log /var/log/nginx/ingles03_access.log;
    error_log /var/log/nginx/ingles03_error.log;
}
